name: Release

# Publishes to Maven Central when a version tag (v1.2.3) is pushed.
# The tag must match the version in pom.xml.
#
# Secrets live in the protected "maven-central" environment, which only
# accepts version tags and waits for a reviewer's approval before this job
# can read them: CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD,
# GPG_PRIVATE_KEY, GPG_PASSPHRASE.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: CENTRAL_TOKEN_USERNAME
          server-password-env-var: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Check that the tag matches the pom version
        run: |
          pom_version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pom_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pom.xml version $pom_version"
            exit 1
          fi

      - name: Build, sign and publish
        run: ./mvnw -B -Prelease clean deploy -Dcentral.autoPublish=true -Dcentral.waitUntil=published
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
